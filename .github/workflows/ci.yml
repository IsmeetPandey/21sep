name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q mcp_changeguard tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          printf '{"tools":[{"name":"x","inputSchema":{"type":"object"}}]}' > before.json
          printf '{"tools":[]}' > after.json
          set +e
          python -m mcp_changeguard.cli before.json after.json --json --fail-on breaking
          code=$?
          set -e
          rm before.json after.json
          test "$code" -eq 1
