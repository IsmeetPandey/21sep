[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-changeguard"
version = "0.1.0"
description = "Deterministic contract-diff checks for MCP tool changes"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
mcp-changeguard = "mcp_changeguard.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_changeguard*"]
